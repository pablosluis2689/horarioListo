<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mochila Lista</title>
<meta name="theme-color" content="#6366F1">

<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3456/3456426.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mochila Lista">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F6FB;
  --bg-grad:linear-gradient(180deg,#EEF1FB 0%,#F4F6FB 100%);
  --card:rgba(255,255,255,0.75);
  --card-solid:#fff;
  --primary:#6366F1;
  --primary-light:#E0E7FF;
  --primary-dark:#4F46E5;
  --success:#10B981;
  --danger:#EF4444;
  --warning:#F59E0B;
  --text:#0F172A;
  --text-muted:#64748B;
  --text-soft:#94A3B8;
  --border:rgba(15,23,42,0.06);
  --border-strong:rgba(15,23,42,0.12);
  --shadow-sm:0 2px 8px rgba(15,23,42,0.04);
  --shadow-md:0 8px 24px rgba(15,23,42,0.08);
  --shadow-lg:0 20px 50px rgba(99,102,241,0.15);
  --radius:20px;
  --radius-sm:14px;
  --radius-pill:999px;
}
@media (prefers-color-scheme: dark) {
  :root{
    --bg:#0B1020;
    --bg-grad:linear-gradient(180deg,#0B1020 0%,#111735 100%);
    --card:rgba(30,35,60,0.7);
    --card-solid:#1A2040;
    --primary:#818CF8;
    --primary-light:#312E81;
    --primary-dark:#A5B4FC;
    --text:#F1F5F9;
    --text-muted:#94A3B8;
    --text-soft:#64748B;
    --border:rgba(255,255,255,0.08);
    --border-strong:rgba(255,255,255,0.15);
    --shadow-sm:0 2px 8px rgba(0,0,0,0.3);
    --shadow-md:0 8px 24px rgba(0,0,0,0.4);
    --shadow-lg:0 20px 50px rgba(0,0,0,0.5);
  }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:var(--bg-grad);
  color:var(--text);
  font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  font-size:15px;
  line-height:1.5;
  padding-bottom:110px;
  min-height:100vh;
  overflow-x:hidden;
}
.app-header{
  position:sticky;top:0;z-index:50;
  background:var(--card);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--border);
  padding:14px 16px;
}
.header-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  max-width:520px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}
.brand-icon{
  width:36px;height:36px;border-radius:12px;
  background:linear-gradient(135deg,var(--primary),var(--primary-dark));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(99,102,241,0.35);
  color:white;font-size:18px;
}
.header-actions{display:flex;align-items:center;gap:8px}
.icon-btn{
  width:40px;height:40px;border-radius:12px;
  background:var(--card-solid);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;color:var(--text);
  transition:transform .15s ease, background .15s ease;
}
.icon-btn:active{transform:scale(0.92)}
.hijo-selector{
  background:var(--primary-light);color:var(--primary-dark);
  border:none;padding:8px 14px;border-radius:999px;
  font-weight:700;font-size:14px;cursor:pointer;
  display:flex;align-items:center;gap:6px;
  max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.container{max-width:520px;margin:0 auto;padding:16px}
.card{
  background:var(--card);
  backdrop-filter:blur(10px);
  border:1px solid var(--border);
  border-radius:20px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(15,23,42,0.04);
}
.card-title{font-size:13px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.card-title .dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
.hero{
  background:linear-gradient(135deg,var(--primary) 0%,#8B5CF6 100%);
  color:white;border:none;
  padding:22px;border-radius:20px;
  box-shadow:0 20px 50px rgba(99,102,241,0.15);
  position:relative;overflow:hidden;
  margin-bottom:16px;
}
.hero::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,0.12);}
.hero::after{content:'';position:absolute;bottom:-60px;left:-30px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,0.08);}
.hero > *{position:relative;z-index:1}
.hero-greet{font-size:13px;opacity:.85;font-weight:500;margin-bottom:4px}
.hero-title{font-size:22px;font-weight:800;line-height:1.2;margin-bottom:14px}
.hero-sub{font-size:13px;opacity:.9;margin-bottom:14px;line-height:1.5}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px}
.hero-chip{background:rgba(255,255,255,0.2);backdrop-filter:blur(10px);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
.checklist{display:flex;flex-direction:column;gap:8px}
.check-item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--border);border-radius:14px;cursor:pointer;}
.check-item.done{opacity:.5}
.check-item.done .check-label{text-decoration:line-through}
.check-box{width:24px;height:24px;border-radius:8px;border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:transparent;}
.check-item.done .check-box{background:#10B981;border-color:#10B981;color:white;}
.materia-tag{display:inline-flex;align-items:center;gap:6px;padding:8px 12px;border-radius:999px;color:white;font-size:13px;font-weight:600;margin:3px;}
.materia-tag .x{background:rgba(0,0,0,0.25);border-radius:50%;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;font-size:11px;}
.day-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;}
.day-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.day-name{font-weight:800;font-size:15px;display:flex;align-items:center;gap:8px}
.day-badge{background:var(--primary-light);color:var(--primary-dark);padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;}
.input-row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.input{flex:1;padding:12px 14px;background:var(--card-solid);border:1px solid var(--border);border-radius:14px;font-size:14px;color:var(--text);font-family:inherit;}
.input:focus{outline:none;border-color:var(--primary)}
.input-color{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);padding:3px;cursor:pointer;background:var(--card-solid);}
.sug{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.sug span{background:var(--primary-light);color:var(--primary-dark);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;}
.nota{font-size:12px;color:var(--text-muted);background:var(--primary-light);padding:8px 12px;border-radius:10px;margin-top:6px;display:flex;align-items:center;gap:6px;}
.btn{background:var(--primary);color:white;border:none;padding:13px 20px;border-radius:14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-full{width:100%}.btn-ghost{background:var(--card-solid);color:var(--text);border:1px solid var(--border)}.btn-danger{background:#EF4444}.btn-success{background:#10B981}.btn-sm{padding:9px 14px;font-size:13px;border-radius:10px}.btn-row{display:flex;gap:8px;flex-wrap:wrap}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--card);backdrop-filter:blur(20px);border:1px solid var(--border);border-radius:999px;padding:6px;box-shadow:0 8px 24px rgba(15,23,42,0.08);display:flex;gap:4px;z-index:40;max-width:calc(100% - 24px);}
.nav button{background:transparent;border:none;padding:10px 14px;border-radius:999px;color:var(--text-muted);font-weight:600;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:inherit;}
.nav button.active{background:var(--primary);color:white;box-shadow:0 4px 12px rgba(99,102,241,0.4);}
.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,0.5);backdrop-filter:blur(4px);z-index:100;opacity:0;pointer-events:none;transition:opacity .25s ease;}
.modal-backdrop.show{opacity:1;pointer-events:auto}
.bottom-sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card-solid);border-radius:24px 24px 0 0;padding:20px 20px 30px;z-index:101;transform:translateY(100%);transition:transform .3s ease;max-height:85vh;overflow-y:auto;}
.bottom-sheet.show{transform:translateY(0)}
.sheet-handle{width:40px;height:4px;border-radius:2px;background:var(--border-strong);margin:0 auto 16px;}
.sheet-title{font-size:18px;font-weight:800;margin-bottom:16px}
.cal-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;}
.cal-col{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px;min-height:140px;}
.cal-col h4{font-size:11px;font-weight:800;text-align:center;margin-bottom:8px;color:var(--text-muted);text-transform:uppercase;}
.cal-item{border-radius:10px;padding:8px 6px;margin-bottom:6px;color:white;font-size:11px;font-weight:700;text-align:center;word-break:break-word;}
.hijo-item{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;}
.hijo-item.active{border-color:var(--primary);background:var(--primary-light)}
.hijo-avatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--primary),#8B5CF6);color:white;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;flex-shrink:0;}
.hijo-info{flex:1;min-width:0}.hijo-name{font-weight:700;font-size:14px}.hijo-meta{font-size:11px;color:var(--text-muted)}.hijo-actions{display:flex;gap:4px}
.label{display:block;font-size:12px;font-weight:600;color:var(--text-muted);margin:10px 0 4px;}
.item-card{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:14px;margin-bottom:10px;}
.item-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px}.item-title{font-weight:700;font-size:15px}.item-meta{font-size:12px;color:var(--text-muted);margin-bottom:6px}
.item-note{font-size:12px;color:var(--text-muted);background:var(--primary-light);padding:8px 12px;border-radius:10px;margin-top:8px;}
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;background:var(--primary-light);color:var(--primary-dark);}
.chip.success{background:rgba(16,185,129,0.15);color:#10B981}.chip.danger{background:rgba(239,68,68,0.15);color:#EF4444}
.dias-checks{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.dias-checks label{background:var(--card);border:1px solid var(--border);padding:8px 12px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:6px;}
.empty{text-align:center;padding:30px 20px;color:var(--text-soft);}.empty-emoji{font-size:40px;margin-bottom:8px}.empty-text{font-size:13px}
.hidden{display:none!important}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row">
    <div class="brand"><div class="brand-icon">🎒</div><div>Mochila Lista</div></div>
    <div class="header-actions">
      <button class="hijo-selector" id="hijoSelector" onclick="openHijosModal()"><span id="hijoActualNombre">Hijo</span> ▼</button>
      <button class="icon-btn" onclick="openSettings()">⚙️</button>
    </div>
  </div>
</header>
<div class="container">
  <div id="view-hoy">
    <div class="hero">
      <div class="hero-greet" id="heroGreet">¡Hola!</div>
      <div class="hero-title" id="heroTitle">Preparando la mochila...</div>
      <div class="hero-sub" id="heroSub"></div>
      <div class="hero-chips" id="heroChips"></div>
    </div>
    <div class="card"><div class="card-title"><span class="dot"></span> Checklist de mañana</div><div id="checklistContainer"></div></div>
    <div class="card"><div class="card-title"><span class="dot" style="background:#F59E0B"></span> Próximas tareas</div><div id="proximasTareas"></div></div>
    <div class="card"><div class="card-title"><span class="dot" style="background:#10B981"></span> Extras de hoy</div><div id="extrasHoy"></div></div>
  </div>
  <div id="view-colegio" class="hidden">
    <div class="card">
      <div class="card-title"><span class="dot"></span> Alarma de mochila</div>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:10px">Te avisaremos a esta hora</div>
      <div class="input-row"><input type="time" id="horaMochila" class="input" value="19:00"><button class="btn btn-sm" onclick="guardarHora()">Guardar</button></div>
    </div>
    <div id="diasContainer"></div>
  </div>
  <div id="view-calendario" class="hidden">
    <div class="card"><div class="card-title"><span class="dot"></span> Vista semanal</div><button class="btn btn-ghost btn-full" onclick="window.print()">🖨️ Imprimir horario</button></div>
    <div class="card"><div id="calendarioSimple" class="cal-grid"></div></div>
  </div>
  <div id="view-extras" class="hidden">
    <div class="card"><div class="card-title"><span class="dot" style="background:#10B981"></span> Actividades extras</div><button class="btn btn-full" onclick="openExtraSheet()">+ Nueva actividad</button></div>
    <div id="listaExtras"></div>
  </div>
  <div id="view-tareas" class="hidden">
    <div class="card"><div class="card-title"><span class="dot" style="background:#F59E0B"></span> Tareas pendientes</div><button class="btn btn-full" onclick="openTareaSheet()">+ Nueva tarea</button></div>
    <div id="listaTareas"></div>
  </div>
</div>
<nav class="nav">
  <button id="btn-hoy" class="active" onclick="switchView('hoy')">📅<br>Hoy</button>
  <button id="btn-colegio" onclick="switchView('colegio')">📚<br>Colegio</button>
  <button id="btn-calendario" onclick="switchView('calendario')">🗓️<br>Semana</button>
  <button id="btn-extras" onclick="switchView('extras')">⚽<br>Extras</button>
  <button id="btn-tareas" onclick="switchView('tareas')">✅<br>Tareas</button>
</nav>

<div class="modal-backdrop" id="modalBackdrop" onclick="closeAllModals()"></div>

<div class="bottom-sheet" id="sheetHijos">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Mis hijos</div>
  <div id="listaHijos"></div>
  <div style="margin-top:12px">
    <div class="input-row">
      <input id="inputNuevoHijo" class="input" placeholder="Nombre del nuevo hijo">
      <button class="btn btn-sm" onclick="agregarHijo()">Agregar</button>
    </div>
  </div>
</div>

<div class="bottom-sheet" id="sheetExtra">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Nueva actividad extra</div>
  <label class="label">Nombre</label>
  <input id="extraNombre" class="input" placeholder="Ej: Fútbol, Piano...">
  <label class="label">¿Qué llevar?</label>
  <input id="extraNota" class="input" placeholder="Ej: Zapatillas, botella...">
  <label class="label">Hora de inicio</label>
  <input id="extraHora" type="time" class="input" value="16:30">
  <label class="label">Días</label>
  <div id="extraDias" class="dias-checks"></div>
  <label class="label">Avisar con anticipación</label>
  <select id="extraAnt" class="input">
    <option value="15">15 minutos</option>
    <option value="30">30 minutos</option>
    <option value="60" selected>1 hora</option>
    <option value="120">2 horas</option>
  </select>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn btn-ghost" style="flex:1" onclick="closeSheet('sheetExtra')">Cancelar</button>
    <button class="btn" style="flex:1" onclick="guardarExtra()">Guardar</button>
  </div>
</div>

<div class="bottom-sheet" id="sheetTarea">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Nueva tarea</div>
  <label class="label">Título</label>
  <input id="tareaTitulo" class="input" placeholder="Ej: Trabajo de Ciencias">
  <label class="label">Materia</label>
  <select id="tareaMateria" class="input"></select>
  <label class="label">Fecha de entrega</label>
  <input id="tareaFecha" type="date" class="input">
  <label class="label">Nota</label>
  <input id="tareaNota" class="input" placeholder="Detalles opcionales">
  <label class="label">¿Cuándo avisar?</label>
  <select id="tareaAviso" class="input">
    <option value="0_07:00">Mismo día a las 7am</option>
    <option value="1_19:00" selected>1 día antes a las 7pm</option>
    <option value="2_19:00">2 días antes</option>
    <option value="7_19:00">1 semana antes</option>
  </select>
  <div class="btn-row" style="margin-top:16px">
    <button class="btn btn-ghost" style="flex:1" onclick="closeSheet('sheetTarea')">Cancelar</button>
    <button class="btn" style="flex:1" onclick="guardarTarea()">Guardar</button>
  </div>
</div>

<div class="bottom-sheet" id="sheetSettings">
  <div class="sheet-handle"></div>
  <div class="sheet-title">Ajustes</div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-title"><span class="dot"></span> Alarmas</div>
    <button class="btn btn-ghost btn-full" onclick="pedirPermiso()">🔔 Activar notificaciones</button>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn btn-sm btn-ghost" style="flex:1" onclick="simularAlarmaMochila()">Probar mochila</button>
      <button class="btn btn-sm btn-ghost" style="flex:1" onclick="simularAlarmaExtra()">Probar extra</button>
    </div>
  </div>
  <div class="card" style="margin-bottom:12px">
    <div class="card-title"><span class="dot" style="background:#10B981"></span> Respaldo</div>
    <div class="btn-row">
      <button class="btn btn-sm btn-ghost" style="flex:1" onclick="exportarDatos()">📤 Exportar</button>
      <button class="btn btn-sm btn-ghost" style="flex:1" onclick="document.getElementById('importFile').click()">📥 Importar</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importarDatos(event)">
    </div>
  </div>
  <div class="card"><button class="btn btn-danger btn-full btn-sm" onclick="borrarTodoHijo()">Borrar datos de este hijo</button></div>
  <button class="btn btn-ghost btn-full" style="margin-top:12px" onclick="closeSheet('sheetSettings')">Cerrar</button>
</div>

<script>
const DIAS=['lunes','martes','miercoles','jueves','viernes'];
const DIAS_LABEL={lunes:'Lun',martes:'Mar',miercoles:'Mié',jueves:'Jue',viernes:'Vie',sabado:'Sáb',domingo:'Dom'};
const DIAS_FULL={lunes:'Lunes',martes:'Martes',miercoles:'Miércoles',jueves:'Jueves',viernes:'Viernes',sabado:'Sábado',domingo:'Domingo'};
const SUGERENCIAS=['Matemática','Lengua','Ciencias','Sociales','Inglés','Ed. Física','Arte','Música','Formación','Computación','Proyecto','Deporte','Tecnología'];
let ultimoColor='#6366F1';
function crearDataVacia(){return {materias:[],horario:{lunes:[],martes:[],miercoles:[],jueves:[],viernes:[]},extras:[],tareas:[],config:{horaMochila:'19:00'}};}

//cambio de usuario pre creado
let app=null;
try{
  app=JSON.parse(localStorage.getItem('mochila_final_v3')||'null');
  if(!app){
    let old=JSON.parse(localStorage.getItem('mochila_final_v2')||'null');
    if(!old) old=JSON.parse(localStorage.getItem('mochila_multi_v1')||'null');
    if(!old) old=JSON.parse(localStorage.getItem('mochila_v4')||'null');
    if(old && old.hijos){app=old;}
    else if(old && old.materias){app={hijos:[{id:Date.now(),nombre:'Hijo 1',data:old}],activo:0};}
    else{app={hijos:[{id:Date.now(),nombre:'Sofía',data:crearDataVacia()}],activo:0};}
  }
}catch(e){
  app={hijos:[{id:Date.now(),nombre:'Sofía',data:crearDataVacia()}],activo:0};
  try{localStorage.clear();}catch(e2){}
}
if(!app.hijos ||!app.hijos.length){app.hijos=[{id:Date.now(),nombre:'Luis',data:crearDataVacia()}];}
if(app.activo==null || app.activo>=app.hijos.length){app.activo=0;}
app.hijos.forEach(function(h){
  if(!h.data) h.data=crearDataVacia();
  if(!h.data.horario) h.data.horario=crearDataVacia().horario;
  if(!h.data.config) h.data.config={horaMochila:'19:00'};
  if(!h.data.materias) h.data.materias=[];

function restarMinutos(horaStr,minutos){if(!horaStr)return null;const parts=horaStr.split(':');let h=parseInt(parts[0]);let m=parseInt(parts[1]);let total=h*60+m-minutos;if(total<0)total+=1440;let nh=Math.floor(total/60);let nm=total%60;let sNh=nh.toString();if(sNh.length<2)sNh='0'+sNh;let sNm=nm.toString();if(sNm.length<2)sNm='0'+sNm;return sNh+':'+sNm;}

function checkAlarmas(){
  if(!app ||!app.hijos ||!app.hijos.length) return;
  const horaAhora = getHoraActual();
  const fechaHoy = getFechaHoy();
  const ahora = new Date();
  const diaMap = ['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  const hoy = diaMap[ahora.getDay()];
  const manana = diaMap[(ahora.getDay()+1)%7];
  const grupos = {};
  for(let idx=0; idx<app.hijos.length; idx++){
    let hijo=app.hijos[idx];
    let dataHijo=null;
    try{let raw=localStorage.getItem('mochila_'+hijo.id); dataHijo=raw? JSON.parse(raw):null;}catch(e){dataHijo=null;}
    if(!dataHijo) continue;
    if(!dataHijo.config) dataHijo.config={};
    if(dataHijo.config.horaMochila && dataHijo.config.horaMochila===horaAhora){
      let llave='mochila_'+horaAhora;
      if(!grupos[llave]) grupos[llave]=[];
      grupos[llave].push({tipo:'mochila',hijoNombre:hijo.nombre,hijoIndex:idx,detalle:getMateriasMananaTexto(dataHijo,manana)});
    }
    if(dataHijo.extras){
      for(let ex of dataHijo.extras){
        if(!ex.dias || ex.dias.indexOf(hoy)===-1) continue;
        if(!ex.horaInicio) continue;
        let aviso=restarMinutos(ex.horaInicio, ex.anticipacionMinutos||30);
        if(aviso===horaAhora){
          let llave='extra_'+horaAhora;
          if(!grupos[llave]) grupos[llave]=[];
          grupos[llave].push({tipo:'extra',hijoNombre:hijo.nombre,hijoIndex:idx,detalle:(ex.nombre||'Actividad')+' a las '+ex.horaInicio+' - Llevar: '+(ex.nota||'')});
        }
      }
    }
    if(dataHijo.tareas){
      for(let t of dataHijo.tareas){
        if(t.fechaAviso===fechaHoy && t.horaAviso===horaAhora){
          let llave='tarea_'+horaAhora;
          if(!grupos[llave]) grupos[llave]=[];
          grupos[llave].push({tipo:'tarea',hijoNombre:hijo.nombre,hijoIndex:idx,detalle:(t.materia||'')+' '+(t.titulo||'')});
        }
      }
    }
  }
  let llaves=Object.keys(grupos);
  for(let k=0;k<llaves.length;k++){
    let llave=llaves[k];
    let items=grupos[llave];
    if(!items||!items.length) continue;
    let storageKey='notificado_grupo_'+llave+'_'+fechaHoy+'_'+horaAhora;
    if(localStorage.getItem(storageKey)) continue;
    if(items.length===1){
      let it=items[0];
      if(it.tipo==='mochila') notificar('🎒 Mochila de '+it.hijoNombre, 'Mañana ('+manana+'): '+(it.detalle||'nada')+'. ¡Arma la mochila!', it.hijoIndex);
      else if(it.tipo==='extra') notificar('⚽ '+it.hijoNombre, it.detalle, it.hijoIndex);
      else notificar('📚 Tarea de '+it.hijoNombre, it.detalle, it.hijoIndex);
    }else{
      let hora=llave.split('_')[1];
      let titulo='', cuerpo='';
      if(items[0].tipo==='mochila'){
        titulo='🎒 Mochila '+hora+' - '+items.length+' hijos';
        let partes=[]; for(let i of items){partes.push('• '+i.hijoNombre+' mañana: '+i.detalle);} cuerpo=partes.join('\n');
      }else if(items[0].tipo==='extra'){
        titulo='⚽ Extras '+hora+' - '+items.length+' hijos';
        let partes=[]; for(let i of items){partes.push('• '+i.hijoNombre+': '+i.detalle);} cuerpo=partes.join('\n');
      }else{
        titulo='📚 Tareas '+hora;
        let partes=[]; for(let i of items){partes.push('• '+i.hijoNombre+': '+i.detalle);} cuerpo=partes.join('\n');
      }
      notificar(titulo, cuerpo, items[0].hijoIndex);
    }
    localStorage.setItem(storageKey,'1');
  }
}

function syncToSW(){
  if(!navigator.serviceWorker.controller) return;
  try{
    const hijosParaSW = app.hijos.map(h=>{
      const raw=localStorage.getItem('mochila_'+h.id);
      const d=raw?JSON.parse(raw):{};
      return {nombre:h.nombre, id:h.id, config:d.config||{}, extras:d.extras||[], tareas:d.tareas||[], horario:d.horario||{}, materias:d.materias||[]};
    });
    navigator.serviceWorker.controller.postMessage({type:'SYNC_HIJOS', hijos:hijosParaSW});
    console.log('SW sync OK', hijosParaSW.length);
  }catch(e){ console.log('SW sync fallo',e); }
}
